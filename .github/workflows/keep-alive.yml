# Keeps the free Supabase project from pausing (it pauses after ~1 week without activity).
# Set it up once: GitHub repo → Settings → Secrets and variables → Actions → Variables →
# New repository variable: APP_URL = your Vercel address (e.g. https://rru-french.vercel.app).
name: Keep database awake
on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days, 08:47 IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL not set yet: nothing to ping."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 "$APP_URL/api/health"
